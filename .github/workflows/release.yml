name: release

# 打一个 v* 标签就交叉编译出三个开发平台的 vkx，作为裸二进制发到 Release。
#
# 只做这一件事：不打包、不校验、不生成安装脚本。依赖不再从网上取——它们随
# 离线安装包一起分发，和这条流水线无关。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            bin: vkx
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            bin: vkx
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            bin: vkx.exe

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: rustup target add ${{ matrix.target }}

      # 两个二进制：vkx 自己，和离线安装器的壳。
      # 壳不含数据，发布之后由 payload::concat 把它和 bundle 拼成自解压包。
      - name: 编译
        run: cargo build --release --target ${{ matrix.target }}

      - name: 改名 (unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/vkx"   "vkx-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/setup" "setup-${{ matrix.name }}"

      - name: 改名 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/vkx.exe"   "vkx-${{ matrix.name }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/setup.exe" "setup-${{ matrix.name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            vkx-${{ matrix.name }}*
            setup-${{ matrix.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
