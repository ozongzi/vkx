name: release

# 打一个 v* 标签就会构建各平台的 vkx 并发到 GitHub Release，
# install/install.sh 与 install/install.ps1 下载的就是这里产出的包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 从 sdk.yml 搬过来的。打包 CI 已经删掉，但 mirror/*.sh 现在是镜像那边
  # 唯一的机制，反而更要守住——下面三条都是真栽过的跟头，塞回去必须失败。
  lint:
    name: 脚本体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 按各自声明的解释器做语法检查
        run: |
          set -eu
          for f in mirror/*.sh install/*.sh; do
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" ;;
              *)      dash -n "$f" ;;   # Ubuntu 的 /bin/sh 是 dash，比 bash 严
            esac
            echo "✓ $f"
          done

      - name: POSIX 脚本别混进 bash 语法
        run: |
          set -eu
          bad=0
          for f in mirror/*.sh install/*.sh; do
            head -1 "$f" | grep -q bash && continue
            if shellcheck -s sh -f gcc "$f" 2>/dev/null | grep 'SC3' ; then
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || { echo "↑ 这些写法在 Ubuntu 的 dash 上会炸"; exit 1; }
          echo "✓ 没有 bash 语法混入"

      - name: 别用 sh 去调 bash 脚本
        run: |
          set -eu
          bad=0
          for f in mirror/*.sh install/*.sh; do
            head -1 "$f" | grep -q bash || continue
            name=$(basename "$f")
            if grep -rnE "(^|[[:space:];&|(])sh +[^ ]*$name" \
                 --include='*.sh' --include='*.yml' . | grep -v ':[[:space:]]*#' ; then
              echo "↑ $name 声明的是 bash，却被 sh 调用"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "✓ 没有解释器错配"

      - name: 变量名后面别紧跟中文
        run: |
          set -eu
          # "$name（...）" 里的全角括号会被 shell 当成变量名的一部分，
          # set -u 下直接崩。要写成 ${name}。
          if LC_ALL=C grep -rnE '\$[A-Za-z_][A-Za-z0-9_]*[^[:print:][:space:]]' \
               --include='*.sh' --include='*.yml' . \
               | grep -v '\${' | grep -v ':[[:space:]]*#' ; then
            echo "↑ 变量名后面紧跟了非 ASCII 字符，加大括号"
            exit 1
          fi
          echo "✓ 没有这个陷阱"

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64 也在 arm64 机器上交叉编译：macos-13 runner 已在退役，
          # 排队常常等不到；Xcode 自带两个架构的 SDK，交叉编译开箱可用。
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: rustup target add ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包 (unix)
        if: runner.os != 'Windows'
        run: |
          version="${GITHUB_REF_NAME}"
          name="vkx-${version}-${{ matrix.target }}"
          # 压缩包里就一个可执行文件，安装脚本直接取 ./vkx
          tar -czf "${name}.tar.gz" -C "target/${{ matrix.target }}/release" vkx
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: 打包 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $name = "vkx-$version-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/vkx.exe" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash | Out-File "$name.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            vkx-*.tar.gz
            vkx-*.zip
            vkx-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
