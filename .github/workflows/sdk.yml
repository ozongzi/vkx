name: sdk

# 造各平台的 SDK 包，发到一个 Release，由镜像同步过去。
#
# 一个平台一个包，里面按组件分段（toolchain / libs / vulkan / sources /
# android），每段各压一个 .tar.zst 再首尾相接。vkx 用一次 HTTP Range 就能只取
# 需要的那一段——不做安卓的人不必下那几 GB。
#
# 为什么 C 库要我们自己编而不是用上游的二进制：
#   · 上游不是每个平台都有（Linux、iOS 基本都得自己编）
#   · 同一个包里的库必须是同一套编译器、同一组开关编出来的，ABI 才对得齐
#   · 可选依赖要一律关掉，否则会摸到构建机上的 libpng 之类，编出来的库依赖
#     一个不在包里的东西，读者链接时才报 Undefined symbols
#
# Jolt 和 GameNetworkingSockets 只放源码：它们的公开接口是 C++ 类，预编译的 .a
# 要和读者的标准库实现、异常/RTTI 开关全部对齐，对不上就崩在 std::string 的
# 析构里。
on:
  workflow_dispatch:
    inputs:
      only_platforms:
        description: "只跑这些平台，逗号分隔；留空表示全部"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 平台无关的部分先做一次，各平台共用
  # ---------------------------------------------------------------------------
  lint:
    name: 脚本体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 这三条都是真栽过的跟头，每一次都要烧掉一轮二十分钟的矩阵才暴露，
      # 所以放在最前面当门禁。
      - name: 按各自声明的解释器做语法检查
        run: |
          set -eu
          for f in mirror/*.sh install/*.sh; do
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" ;;
              *)      dash -n "$f" ;;   # Ubuntu 的 /bin/sh 是 dash，比 bash 严
            esac
            echo "✓ $f"
          done

      # dash -n 只查语法。`[[ ]]` 这种在 dash 眼里是个合法的命令名，
      # 要到运行时才报 not found，所以还得靠 shellcheck 的 SC3xxx——
      # 那一族的意思正好就是「POSIX sh 里没有这个」。
      # 只看 SC3xxx，其余风格问题不拦。
      - name: POSIX 脚本别混进 bash 语法
        run: |
          set -eu
          bad=0
          for f in mirror/*.sh install/*.sh; do
            head -1 "$f" | grep -q bash && continue
            if shellcheck -s sh -f gcc "$f" 2>/dev/null | grep 'SC3' ; then
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || { echo "↑ 这些写法在 Ubuntu 的 dash 上会炸"; exit 1; }
          echo "✓ 没有 bash 语法混入"

      - name: 别用 sh 去调 bash 脚本
        run: |
          set -eu
          bad=0
          for f in mirror/*.sh install/*.sh; do
            head -1 "$f" | grep -q bash || continue
            name=$(basename "$f")
            # 用 sh 调会覆盖掉 shebang，dash 上 set -o pipefail 直接报错。
            # 前面要卡词边界，否则 `bash x.sh` 里的 "sh " 也会被算上；
            # 行首的 # 要排掉，注释里提这件事不算犯这件事。
            if grep -rnE "(^|[[:space:];&|(])sh +[^ ]*$name" \
                 --include='*.sh' --include='*.yml' . | grep -v ':[[:space:]]*#' ; then
              echo "↑ $name 声明的是 bash，却被 sh 调用"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "✓ 没有解释器错配"

      - name: 变量名后面别紧跟中文
        run: |
          set -eu
          # "$name（...）" 里的全角括号会被 shell 当成变量名的一部分，
          # set -u 下直接崩。要写成 ${name}。
          # 不用 grep -P：macOS 的 BSD grep 没有，本地就没法自己验这条了。
          # LC_ALL=C 下高位字节既不是 [:print:] 也不是 [:space:]。
          if LC_ALL=C grep -rnE '\$[A-Za-z_][A-Za-z0-9_]*[^[:print:][:space:]]' \
               --include='*.sh' --include='*.yml' . \
               | grep -v '\${' | grep -v ':[[:space:]]*#' ; then
            echo "↑ 变量名后面紧跟了非 ASCII 字符，加大括号"
            exit 1
          fi
          echo "✓ 没有这个陷阱"

  sources:
    name: sources（平台无关）
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: 取 Jolt 和 GameNetworkingSockets 源码
        run: sh mirror/build-sources.sh staging/sources
      - uses: actions/upload-artifact@v4
        with:
          name: component-sources
          path: staging/sources
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 每个平台编自己的 C 库，拼包
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only_platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          # runner 标签和 release.yml 保持一致——那套是跑通过的。
          # macos-x64 在 arm64 的机器上交叉编译（-DCMAKE_OSX_ARCHITECTURES），
          # 比依赖已经进入退役期的 macos-13 稳。
          ALL = [
              {"os": "macos-14",         "platform": "macos-arm64",   "cmake": "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"},
              {"os": "macos-14",         "platform": "macos-x64",     "cmake": "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"},
              {"os": "ubuntu-latest",    "platform": "linux-x64",     "cmake": ""},
              {"os": "ubuntu-24.04-arm", "platform": "linux-arm64",   "cmake": ""},
              {"os": "windows-latest",   "platform": "windows-x64",   "cmake": ""},
              {"os": "windows-11-arm",   "platform": "windows-arm64", "cmake": ""},
          ]
          only = [s.strip() for s in os.environ.get("ONLY", "").split(",") if s.strip()]
          picked = ALL if not only else [e for e in ALL if e["platform"] in only]
          print(f"matrix={json.dumps({'include': picked})}")
          print("要跑的平台:", [e["platform"] for e in picked], file=sys.stderr)
          PY

  pack:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [plan, sources]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # 编 C 库要 cmake + ninja + zstd。Windows 上统一用 llvm-mingw，
      # 不用 MSVC——SDK 里的库和读者的代码必须是同一种 ABI。
      - name: 准备构建工具
        shell: bash
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS)
              brew install ninja zstd >/dev/null
              ;;
            Linux)
              sudo apt-get update -qq
              # SDL 的检测是「全有或全无」：只要它认出了 X11，就要求整套
              # X11 扩展头都在，缺一个就 SDL_missing_dependency 直接失败。
              # Wayland 同理。所以这里按 SDL3 README-linux 装全，不挑。
              sudo apt-get install -y ninja-build zstd \
                  libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
                  libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
                  libwayland-dev wayland-protocols libdecor-0-dev \
                  libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
                  libdbus-1-dev libibus-1.0-dev libudev-dev \
                  libasound2-dev libpulse-dev libpipewire-0.3-dev >/dev/null
              ;;
            Windows)
              choco install ninja zstandard --no-progress -y >/dev/null
              ;;
          esac
          cmake --version | head -1
          ninja --version
          zstd --version

      # Windows 统一用 llvm-mingw，不用 MSVC：SDK 里的库和读者的代码必须是
      # 同一种 ABI，而 MSVC 的工具集也不允许我们分发。
      - name: 取 llvm-mingw（仅 Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          . mirror/versions.sh
          case "${{ matrix.platform }}" in
            windows-x64)   host=x86_64 ;;
            windows-arm64) host=aarch64 ;;
          esac
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW/llvm-mingw-$LLVM_MINGW-ucrt-$host.zip"
          echo "取 $url"
          curl -fsSL "$url" -o mingw.zip
          unzip -q mingw.zip
          dir=$(find . -maxdepth 1 -name 'llvm-mingw-*' -type d | head -1)
          echo "$(cd "$dir/bin" && pwd)" >> "$GITHUB_PATH"

      - name: 编 libs（SDL3 / mbedTLS / zlib / FreeType + 头文件库）
        shell: bash
        env:
          CMAKE_EXTRA: ${{ matrix.cmake }}
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            # llvm-mingw 的 clang 已经在 PATH 上了
            export CMAKE_EXTRA="$CMAKE_EXTRA -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          fi
          sh mirror/build-libs.sh "${{ matrix.platform }}" staging/libs

      # toolchain 和 vulkan 是上游的二进制重打包，沿用已有的 sync.sh 逻辑。
      - name: 收 toolchain 和 vulkan
        shell: bash
        run: sh mirror/collect-prebuilt.sh "${{ matrix.platform }}" staging

      - uses: actions/download-artifact@v4
        with:
          name: component-sources
          path: staging/sources

      - name: 拼包
        shell: bash
        run: sh mirror/pack.sh staging "${{ matrix.platform }}" out

      # 拼完立刻自检：用刚编好的 vkx 从本地的包里取一段，逐字节比对。
      # 包发出去之前先证明它是能用的。
      # 自检要用 vkx 真的从包里取一遍，所以先编一个出来。
      - name: 编 vkx（自检用）
        shell: bash
        run: cargo build --release

      - name: 自检
        shell: bash
        run: sh mirror/verify-pack.sh out "${{ matrix.platform }}" staging

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: out/

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: dist

      # 摊成镜像真正要对外提供的目录结构。vkx 请求的是
      #   <镜像>/sdk/<平台>/manifest.txt
      #   <镜像>/sdk/<平台>/sdk-<平台>.pack
      # 每个平台各有一个 manifest.txt，名字是撞的——所以不能直接把 dist/**
      # 平铺成 release 资产，得先按平台分目录，上传时再改成带平台名的资产名。
      - name: 摊成镜像目录
        run: |
          set -eu
          mkdir -p site/sdk
          # glob 没匹配上时 shell 会把字面量当成唯一一项，静默摊出一个空站点。
          [ -d "$(echo dist/sdk-* | cut -d' ' -f1)" ] || { echo "没收到任何 pack 产物"; exit 1; }
          for d in dist/sdk-*; do
            platform=${d#dist/sdk-}
            mkdir -p "site/sdk/$platform"
            cp "$d/manifest.txt" "$d/sdk-$platform.pack" "site/sdk/$platform/"
          done
          find site -type f | sort
          du -sh site

      - name: 装 Rust 并编 vkx
        run: cargo build --release

      # 每个包在自己那个 job 里已经逐字节比对过了。这一步验的是另一件事：
      # 摊出来的目录结构对不对——清单能不能按 <平台> 找到、Range 请求能不能
      # 落在正确的偏移上。取每个平台清单里的最后一段，因为它偏移最大，拼接
      # 时算错一个字节最先在这里暴露。取到了就说明 sha256 也对上了。
      - name: 按发布后的地址再验一遍
        run: |
          set -eu
          python3 mirror/rangeserver.py 8971 site &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          for d in site/sdk/*; do
            platform=$(basename "$d")
            last=$(awk '/^component /{c=$2} END{print c}' "$d/manifest.txt")
            home=$(mktemp -d)
            echo "── ${platform}：取 ${last}"
            # USERPROFILE 一并给：Windows 上 vkx 认的是它。这里跑在 Linux
            # 上用不着，但和 verify-pack.sh 保持一致，免得下次谁照抄漏掉。
            env -i HOME="$home" USERPROFILE="$home" PATH= \
              VKX_MIRROR="http://127.0.0.1:8971" VKX_PLATFORM="$platform" \
              ./target/release/vkx fetch --component "$last"
            files=$(find "$home/.vkx/sdk/$last" -type f | wc -l | tr -d ' ')
            [ "$files" -gt 0 ] || { echo "$platform 的 $last 是空的"; exit 1; }
            echo "   ✓ $files 个文件"
            rm -rf "$home"
          done
          echo "$(ls site/sdk | wc -l | tr -d ' ') 个平台的发布地址都能取到。"

      # 资产名带上平台，避免六个 manifest.txt 互相覆盖。
      # 另外打一个 site.tar，解开就是镜像目录，方便一条 rsync 上传。
      - name: 备好 release 资产
        run: |
          set -eu
          mkdir -p assets
          for d in site/sdk/*; do
            platform=$(basename "$d")
            cp "$d/sdk-$platform.pack" assets/
            cp "$d/manifest.txt" "assets/manifest-$platform.txt"
          done
          tar cf assets/site.tar -C site .
          ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sdk-${{ github.run_number }}
          name: SDK ${{ github.run_number }}
          body: |
            六个平台的 SDK 包，已按发布后的地址逐个验过。

            这里只是存档。vkx 默认从 `https://yinli.tech/file` 取，
            要让它生效得把目录摊到站点上：

            ```
            mkdir -p site && tar xf site.tar -C site
            rsync -av --delete site/sdk/ root@yinli.tech:/var/www/file/sdk/
            ```

            `--delete` 只打在 `sdk/` 这一层。镜像根上还有 `install.sh` 和
            `vkx/` 下的二进制，打在根上会把它们一起删掉。
          files: assets/*

      - name: 写上传命令到摘要
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 上传到镜像

          ```sh
          gh release download sdk-${{ github.run_number }} -R ${{ github.repository }} -p site.tar
          mkdir -p site && tar xf site.tar -C site
          rsync -av --delete site/sdk/ root@yinli.tech:/var/www/file/sdk/
          ```

          `--delete` 只打在 `sdk/` 这一层。镜像根上还有 `install.sh` 和 `vkx/`
          下的二进制，打在根上会把它们一起删掉。
          EOF
