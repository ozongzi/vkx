name: sdk

# 造各平台的 SDK 包，发到一个 Release，由镜像同步过去。
#
# 一个平台一个包，里面按组件分段（toolchain / libs / vulkan / sources /
# android），每段各压一个 .tar.zst 再首尾相接。vkx 用一次 HTTP Range 就能只取
# 需要的那一段——不做安卓的人不必下那几 GB。
#
# 为什么 C 库要我们自己编而不是用上游的二进制：
#   · 上游不是每个平台都有（Linux、iOS 基本都得自己编）
#   · 同一个包里的库必须是同一套编译器、同一组开关编出来的，ABI 才对得齐
#   · 可选依赖要一律关掉，否则会摸到构建机上的 libpng 之类，编出来的库依赖
#     一个不在包里的东西，读者链接时才报 Undefined symbols
#
# Jolt 和 GameNetworkingSockets 只放源码：它们的公开接口是 C++ 类，预编译的 .a
# 要和读者的标准库实现、异常/RTTI 开关全部对齐，对不上就崩在 std::string 的
# 析构里。
on:
  workflow_dispatch:
    inputs:
      only_platforms:
        description: "只跑这些平台，逗号分隔；留空表示全部"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 平台无关的部分先做一次，各平台共用
  # ---------------------------------------------------------------------------
  sources:
    name: sources（平台无关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 取 Jolt 和 GameNetworkingSockets 源码
        run: sh mirror/build-sources.sh staging/sources
      - uses: actions/upload-artifact@v4
        with:
          name: component-sources
          path: staging/sources
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 每个平台编自己的 C 库，拼包
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only_platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          # runner 标签和 release.yml 保持一致——那套是跑通过的。
          # macos-x64 在 arm64 的机器上交叉编译（-DCMAKE_OSX_ARCHITECTURES），
          # 比依赖已经进入退役期的 macos-13 稳。
          ALL = [
              {"os": "macos-14",         "platform": "macos-arm64",   "cmake": "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"},
              {"os": "macos-14",         "platform": "macos-x64",     "cmake": "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"},
              {"os": "ubuntu-latest",    "platform": "linux-x64",     "cmake": ""},
              {"os": "ubuntu-24.04-arm", "platform": "linux-arm64",   "cmake": ""},
              {"os": "windows-latest",   "platform": "windows-x64",   "cmake": ""},
              {"os": "windows-11-arm",   "platform": "windows-arm64", "cmake": ""},
          ]
          only = [s.strip() for s in os.environ.get("ONLY", "").split(",") if s.strip()]
          picked = ALL if not only else [e for e in ALL if e["platform"] in only]
          print(f"matrix={json.dumps({'include': picked})}")
          print("要跑的平台:", [e["platform"] for e in picked], file=sys.stderr)
          PY

  pack:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [plan, sources]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # 编 C 库要 cmake + ninja + zstd。Windows 上统一用 llvm-mingw，
      # 不用 MSVC——SDK 里的库和读者的代码必须是同一种 ABI。
      - name: 准备构建工具
        shell: bash
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS)
              brew install ninja zstd >/dev/null
              ;;
            Linux)
              sudo apt-get update -qq
              # SDL 的检测是「全有或全无」：只要它认出了 X11，就要求整套
              # X11 扩展头都在，缺一个就 SDL_missing_dependency 直接失败。
              # Wayland 同理。所以这里按 SDL3 README-linux 装全，不挑。
              sudo apt-get install -y ninja-build zstd \
                  libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
                  libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
                  libwayland-dev wayland-protocols libdecor-0-dev \
                  libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
                  libdbus-1-dev libibus-1.0-dev libudev-dev \
                  libasound2-dev libpulse-dev libpipewire-0.3-dev >/dev/null
              ;;
            Windows)
              choco install ninja zstandard --no-progress -y >/dev/null
              ;;
          esac
          cmake --version | head -1
          ninja --version
          zstd --version

      # Windows 统一用 llvm-mingw，不用 MSVC：SDK 里的库和读者的代码必须是
      # 同一种 ABI，而 MSVC 的工具集也不允许我们分发。
      - name: 取 llvm-mingw（仅 Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          . mirror/versions.sh
          case "${{ matrix.platform }}" in
            windows-x64)   host=x86_64 ;;
            windows-arm64) host=aarch64 ;;
          esac
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW/llvm-mingw-$LLVM_MINGW-ucrt-$host.zip"
          echo "取 $url"
          curl -fsSL "$url" -o mingw.zip
          unzip -q mingw.zip
          dir=$(find . -maxdepth 1 -name 'llvm-mingw-*' -type d | head -1)
          echo "$(cd "$dir/bin" && pwd)" >> "$GITHUB_PATH"

      - name: 编 libs（SDL3 / mbedTLS / zlib / FreeType + 头文件库）
        shell: bash
        env:
          CMAKE_EXTRA: ${{ matrix.cmake }}
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            # llvm-mingw 的 clang 已经在 PATH 上了
            export CMAKE_EXTRA="$CMAKE_EXTRA -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          fi
          sh mirror/build-libs.sh "${{ matrix.platform }}" staging/libs

      # toolchain 和 vulkan 是上游的二进制重打包，沿用已有的 sync.sh 逻辑。
      - name: 收 toolchain 和 vulkan
        shell: bash
        run: sh mirror/collect-prebuilt.sh "${{ matrix.platform }}" staging

      - uses: actions/download-artifact@v4
        with:
          name: component-sources
          path: staging/sources

      - name: 拼包
        shell: bash
        run: sh mirror/pack.sh staging "${{ matrix.platform }}" out

      # 拼完立刻自检：用刚编好的 vkx 从本地的包里取一段，逐字节比对。
      # 包发出去之前先证明它是能用的。
      # 自检要用 vkx 真的从包里取一遍，所以先编一个出来。
      - name: 编 vkx（自检用）
        shell: bash
        run: cargo build --release

      - name: 自检
        shell: bash
        run: sh mirror/verify-pack.sh out "${{ matrix.platform }}" staging

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: out/

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sdk-${{ github.run_number }}
          files: dist/**/*
